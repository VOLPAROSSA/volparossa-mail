name: Mail integration source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify test tools
        run: |
          python3 --version
          node --version
      - name: Check source, licenses and inert integration contracts
        run: python3 -B -m unittest discover -s tests -v
      - name: Check Stalwart mail connector contracts
        run: node --test extensions/volparossa-mail-host/tests/jmap_contract.mjs

  signal-mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integration/signal-mail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: integration/signal-mail
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install the locked Signal native package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo 'e24a9e4c701686327d602944de2fc383bccf1b93c371661dd5998f97d8aed7d4  node_modules/@signalapp/libsignal-client/prebuilds/linux-x64/@signalapp+libsignal-client.node' | sha256sum --check
      - name: Exchange original mail bytes between restarted owners without network access
        run: |
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            "$(command -v node)" --test test.mjs
