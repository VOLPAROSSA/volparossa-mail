name: Native Thunderbird owner inbox

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-owner-inbox.yml'
      - 'extensions/volparossa-mail-host/**'
      - 'extensions/volparossa-peer-draft/**'
      - 'scripts/peer_draft_install.py'
      - 'tests/thunderbird_peer_draft_guest.py'
      - 'tests/thunderbird_composed_draft.py'
      - 'scripts/*stalwart*.py'
      - 'scripts/export_mail_custody.py'
      - 'scripts/thunderbird_*.py'
      - 'packaging/systemd/**'
      - 'tests/owner_service_*'
      - 'tests/peer_mail_*'
      - 'integration/peer-mail/**'
      - 'integration/signal-mail/**'
      - 'tests/owner_imaps.py'
      - 'third_party/stalwart/**'
      - 'third_party/stalwart-source.json'
      - 'third_party/stalwart-rust-toolchain.json'
      - 'third_party/thunderbird-extension-smoke.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-inbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'

      - id: archive
        uses: VOLPAROSSA/.github/actions/ubuntu-archive@0b26926c9893b01713aded0d331efb1333ddf0c0

      - name: Prepare the disposable display and verify namespace support
        env:
          ARCHIVE_CONFIG: ${{ steps.archive.outputs.config }}
        run: |
          sudo apt-get -c "$ARCHIVE_CONFIG" install -y --no-install-recommends bubblewrap xvfb x11-utils x11-xkb-utils \
            dbus-x11 fonts-dejavu-core libgtk-3-0 libasound2 libdbus-glib-1-2 libxtst6 \
            libnss3-tools openssl clang libclang-dev pkg-config cmake gcc g++ make libssl-dev protobuf-compiler
          bwrap --unshare-user --unshare-pid --unshare-net --cap-drop ALL --ro-bind / / \
            --proc /proc --dev /dev -- /usr/bin/true
          mkdir -p build/display
          cd build/display
          version=$(dpkg-query -W -f='${Version}' xvfb)
          apt-get -c "$ARCHIVE_CONFIG" download "xvfb=$version"
          dpkg-deb -x ./*.deb package
          cmp package/usr/bin/Xvfb /usr/bin/Xvfb

      - name: Fetch pinned sources and compile Stalwart Community offline
        run: |
          python3 -B scripts/prepare_stalwart.py --fetch --output build/stalwart-0.16.24
          python3 -B scripts/prepare_stalwart_toolchain.py --fetch --output build/stalwart-rust-1.98.1
          python3 -B scripts/build_stalwart.py --fetch --output build/stalwart-community | tee build/compile.jsonl
          tail -n 1 build/compile.jsonl | jq -e 'select(.community_compiled and .source_unchanged)' > build/compiled.json

      - name: Open the delivered message in a fresh Thunderbird profile
        run: |
          archive="$PWD/build/thunderbird.tar.xz"
          url=$(jq -er .runtime_inputs.distribution_url third_party/thunderbird-extension-smoke.json)
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --output "$archive" "$url"
          xvfb_sha=$(sha256sum build/display/package/usr/bin/Xvfb | cut -d ' ' -f 1)
          python3 -B scripts/smoke_thunderbird_stalwart.py --inbox --execute \
            --thunderbird-archive "$archive" --xvfb /usr/bin/Xvfb --xvfb-sha256 "$xvfb_sha" \
            --stalwart "$PWD/build/stalwart-community/target/debug/stalwart" \
            --stalwart-sha256 "$(jq -er .sha256 build/compiled.json)" --output build/owner-inbox

      - name: Recover the installed mailbox automatically after process loss
        run: |
          bash tests/owner_service_actions.sh "$PWD/build/stalwart-community/target/debug/stalwart" \
            "$(jq -er .sha256 build/compiled.json)" "$PWD/build/owner-inbox"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      - name: Check out the Core mailbox provider pair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa
          ref: afec77da8317707225dd6c94e02c26803fb4e02a
          path: build/paired-core
          persist-credentials: false

      - name: Build the ordinary Core client and two independent mailbox stores
        working-directory: build/paired-core
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          test "$(git rev-parse HEAD)" = afec77da8317707225dd6c94e02c26803fb4e02a
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 fetch --locked --target x86_64-unknown-linux-gnu
          cargo +1.89.0 build --locked --offline -p volparossa --bin volparossa --example mailbox-provider-pair
          mkdir "$RUNNER_TEMP/mail-core-pair"
          install -m 0555 target/debug/volparossa target/debug/examples/mailbox-provider-pair "$RUNNER_TEMP/mail-core-pair/"

      - name: Deliver a complete Signal-encrypted message to an offline owner
        run: |
          npm ci --prefix integration/signal-mail --ignore-scripts --no-audit --no-fund
          echo 'e24a9e4c701686327d602944de2fc383bccf1b93c371661dd5998f97d8aed7d4  integration/signal-mail/node_modules/@signalapp/libsignal-client/prebuilds/linux-x64/@signalapp+libsignal-client.node' | sha256sum --check
          python3 -B tests/peer_mail_namespace.py --node "$(command -v node)" \
            --stalwart build/stalwart-community/target/debug/stalwart --core-dir "$RUNNER_TEMP/mail-core-pair" \
            --thunderbird-archive build/thunderbird.tar.xz --xvfb /usr/bin/Xvfb \
            > build/owner-inbox/peer-mail.json
          jq -e '
            .provider_acks == 2 and .exact_raw_bytes_verified and .messages_after_ack == 0
            and .original_handoff_resumed and .pickup_killed_after_provider_acks
            and .interrupted_plaintext_staging_removed and .concurrent_pickups_imported_once
            and .final_receipts_recovered_while_offline and .individual_signed_acks_recovered_without_aggregate
            and .altered_and_mixed_acks_refused and .automatic_pickup.reconnected
            and .automatic_pickup.automatic_imports == 1 and .automatic_pickup.stopped_cleanly
          ' build/owner-inbox/peer-mail.json

      - name: Send a native Thunderbird draft to its paired owner
        run: |
          python3 -B scripts/peer_draft_install.py package build/owner-inbox/volparossa-peer-draft.xpi
          for trial in draft compose; do
            receipt="build/owner-inbox/peer-$trial.json"
            python3 -B tests/peer_mail_namespace.py --"$trial" --node "$(command -v node)" \
              --stalwart build/stalwart-community/target/debug/stalwart --core-dir "$RUNNER_TEMP/mail-core-pair" \
              --thunderbird-archive build/thunderbird.tar.xz --xvfb /usr/bin/Xvfb > "$receipt"
            jq -e '.receiver_picked_up_paired_invitation and .native_toolbar_and_send_clicked and .original_correspondence_bytes and .verified_import_acknowledgements == 2 and .receiver_inbox.message_body_displayed' "$receipt"
          done
          jq -e '.edited_and_saved_in_composer and .filelink_refused_before_custody and .oversize_encrypted_message_refused_before_custody' build/owner-inbox/peer-compose.json
      - name: Export the proven Linux mailbox runtime for the routed Core trial
        run: python3 -I -B scripts/export_mail_custody.py

      - name: Keep the signed-custody QA runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mail-custody-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mail-custody-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Keep the build, mailbox and cleanup receipts
        if: ${{ !cancelled() && hashFiles('build/stalwart-community/BUILD_OWNER.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-owner-inbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/stalwart-community/BUILD_OWNER.json
            build/stalwart-community/fetch-*.json
            build/stalwart-community/compile-*.json
            build/compiled.json
            build/owner-inbox/inputs.json
            build/owner-inbox/ui-restart.json
            build/owner-inbox/boundary.json
            build/owner-inbox/owner-service.json
            build/owner-inbox/peer-mail.json
            build/owner-inbox/peer-draft.json
            build/owner-inbox/peer-compose.json
            build/owner-inbox/volparossa-peer-draft.xpi
            build/owner-inbox/owner-imaps.json
          if-no-files-found: error
          retention-days: 14
